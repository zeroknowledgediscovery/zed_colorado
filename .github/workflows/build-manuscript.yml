name: Build manuscript PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'tex/**/*.tex'
      - 'tex/build_full_manuscript.sh'
      - 'zebra_comp/RESULTS/**/*.csv'
      - '.github/workflows/build-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            texlive-publishers \
            texlive-science

      - name: Build empirical manuscript
        working-directory: tex
        run: bash build_full_manuscript.sh

      - name: Verify Supplementary Table S10
        working-directory: tex
        run: |
          grep -Fq '\\newlabel{tab:supp-genomic-inventory}{{S10}' zebra_genomics_boundary_theorem_empirical.aux
          grep -Fq 'supplementary_genomic_panel_table.tex' zebra_genomics_boundary_theorem_empirical.fls
          if grep -Fq 'Float too large' zebra_genomics_boundary_theorem_empirical.log; then
            echo 'Inventory table is too large for a page' >&2
            exit 1
          fi

      - name: Commit rebuilt PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tex/zebra_genomics_boundary_theorem_empirical.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild manuscript PDF with Supplementary Table S10'
            git push
          fi
